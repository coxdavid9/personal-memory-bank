<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal Memory Bank</title>
<style>
body{font-family:Arial,sans-serif;max-width:1050px;margin:0 auto;padding:28px;background:#f7f8fa;color:#20242a}h1{margin:0 0 6px}.sub{color:#667085;margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;box-shadow:0 2px 8px #00000008}textarea,input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d0d5dd;border-radius:9px;margin:6px 0 12px;font:inherit}textarea{min-height:120px;resize:vertical}button{border:0;border-radius:9px;padding:10px 14px;font-weight:600;cursor:pointer;background:#111827;color:#fff}.secondary{background:#eef2f6;color:#20242a}.entry{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:10px 0}.meta{font-size:12px;color:#667085;margin-bottom:6px}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2ff;margin-right:5px;font-size:11px}.overdue{border-left:4px solid #d92d20}.soon{border-left:4px solid #f79009}.ok{border-left:4px solid #12b76a}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:13px;color:#667085}.status{padding:9px 12px;border-radius:9px;margin:14px 0;font-size:13px}.status.local{background:#fff4e5;color:#8a4b08}.status.persistent{background:#ecfdf3;color:#067647}.empty{color:#667085}.archive{margin-top:18px}@media(max-width:750px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>🧠 Personal Memory Bank</h1>
<p class="sub">Capture it once. Turn it into a reminder, plan, or searchable note.</p>
<div id="storageStatus"></div>
<div class="grid">
<section class="card"><h2>Quick Capture</h2>
<label>What do you want me to remember?</label>
<textarea id="text" placeholder="Example: Ask about the monthly inventory report process."></textarea>
<label>Type</label><select id="type"><option>Work</option><option>Personal</option><option>Idea</option><option>Follow-up</option><option>Learning</option></select>
<label>When should it come back?</label><input id="due" type="datetime-local">
<label>Priority</label><select id="priority"><option>Normal</option><option>High</option><option>Low</option></select>
<div class="actions"><button onclick="saveEntry()">Save to Memory Bank</button><button class="secondary" onclick="clearForm()">Clear</button></div>
<p class="small">Your memories will be stored on the server once persistent storage is connected.</p>
</section>
<section class="card"><h2>What needs attention?</h2><div id="attention"></div></section>
</div>
<section class="card archive"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin-right:auto">My Memories</h2><input id="search" style="max-width:280px;margin:0" placeholder="Search memories..." oninput="render()"><select id="filter" style="max-width:160px;margin:0" onchange="render()"><option>All</option><option>Work</option><option>Personal</option><option>Idea</option><option>Follow-up</option><option>Learning</option></select></div><div id="list"></div></section>
<script>
const KEY='personalMemoryBank.v1';
let entries=JSON.parse(localStorage.getItem(KEY)||'[]');
let persistent=false;

function localSave(){localStorage.setItem(KEY,JSON.stringify(entries))}
function normalize(e){return {id:e.id,text:e.text,type:e.type||'Work',due:e.due||null,priority:e.priority||'Normal',done:Boolean(e.done),created:e.created||new Date().toISOString()}}
async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Request failed');return r.status===204?null:r.json()}
async function load(){
  try{
    const s=await api('/api/status'); persistent=s.persistentStorage;
    if(persistent){
      const data=await api('/api/memories');
      if(data.memories.length===0 && entries.length){
        for(const e of entries){
          const migrated={...e,due:e.due?new Date(e.due).toISOString():null};
          await api('/api/memories',{method:'POST',body:JSON.stringify(migrated)})
        }
        localStorage.removeItem(KEY); entries=[];
        const migrated=await api('/api/memories'); entries=migrated.memories.map(normalize);
      }else entries=data.memories.map(normalize);
    }
  }catch(e){persistent=false}
  updateStorageStatus();render();
}
function updateStorageStatus(){document.getElementById('storageStatus').innerHTML=persistent?'<div class="status persistent">✓ Persistent storage connected — your memories are saved on the server.</div>':'<div class="status local">Local browser storage is active until the database is connected. Your current memories stay in this browser.</div>'}
async function saveEntry(){
  const text=document.getElementById('text').value.trim();if(!text)return alert('Add something to remember first.');
  const dueInput=document.getElementById('due').value;
  const entry={text,type:document.getElementById('type').value,due:dueInput?new Date(dueInput).toISOString():null,priority:document.getElementById('priority').value,done:false,created:new Date().toISOString()};
  try{if(persistent){const saved=await api('/api/memories',{method:'POST',body:JSON.stringify(entry)});entries.unshift(normalize(saved));}else{entries.unshift(normalize({...entry,id:Date.now()}));localSave()}clearForm();render();}catch(e){alert(e.message)}
}
function clearForm(){document.getElementById('text').value='';document.getElementById('due').value='';document.getElementById('priority').value='Normal'}
async function removeEntry(id){try{if(persistent)await api('/api/memories/'+id,{method:'DELETE'});entries=entries.filter(x=>String(x.id)!==String(id));if(!persistent)localSave();render()}catch(e){alert(e.message)}}
async function toggleDone(id){const e=entries.find(x=>String(x.id)===String(id));if(!e)return;e.done=!e.done;try{if(persistent)await api('/api/memories/'+id,{method:'PATCH',body:JSON.stringify({done:e.done})});else localSave();render()}catch(err){e.done=!e.done;alert(err.message)}}
function fmt(d){if(!d)return 'No reminder set';const x=new Date(d);return x.toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}
function render(){
 const q=(document.getElementById('search').value||'').toLowerCase(),f=document.getElementById('filter').value,now=Date.now();
 let filtered=entries.filter(e=>(f==='All'||e.type===f)&&(!q||e.text.toLowerCase().includes(q)||e.type.toLowerCase().includes(q)));filtered.sort((a,b)=>(a.done-b.done)||((a.due?new Date(a.due).getTime():Infinity)-(b.due?new Date(b.due).getTime():Infinity)));
 document.getElementById('list').innerHTML=filtered.length?filtered.map(e=>`<div class="entry ${e.due&&!e.done&&new Date(e.due)<new Date()?'overdue':e.due&&!e.done&&new Date(e.due)-now<604800000?'soon':e.done?'ok':''}"><div class="meta"><span class="tag">${esc(e.type)}</span><span class="tag">${esc(e.priority)}</span> ${fmt(e.due)} ${e.done?' · Done':''}</div><div>${esc(e.text)}</div><div class="actions" style="margin-top:9px"><button class="secondary" onclick="toggleDone('${e.id}')">${e.done?'Reopen':'Mark done'}</button><button class="secondary" onclick="removeEntry('${e.id}')">Delete</button></div></div>`).join(''):'<p class="empty">Nothing here yet. Capture the first thing you don’t want to forget.</p>';
 const attention=entries.filter(e=>!e.done&&e.due&&new Date(e.due)<=new Date(Date.now()+7*86400000)).sort((a,b)=>new Date(a.due)-new Date(b.due)).slice(0,5);
 document.getElementById('attention').innerHTML=attention.length?attention.map(e=>`<div class="entry ${new Date(e.due)<new Date()?'overdue':'soon'}"><b>${esc(e.text)}</b><div class="meta">${esc(e.type)} · ${fmt(e.due)}</div></div>`).join(''):'<p class="empty">You’re clear for the next 7 days.</p>';
}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
load();
</script>
</body></html>
