<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Bank</title><style>body{font-family:Arial,sans-serif;max-width:1050px;margin:0 auto;padding:28px;background:#f7f8fa;color:#20242a}h1{margin:0 0 6px}p.sub{color:#667085;margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:18px;box-shadow:0 2px 8px #00000008}textarea,input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d0d5dd;border-radius:9px;margin:6px 0 12px;font:inherit}textarea{min-height:120px;resize:vertical}button{border:0;border-radius:9px;padding:10px 14px;font-weight:600;cursor:pointer;background:#111827;color:white}.secondary{background:#eef2f6;color:#20242a}.entry{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:10px 0}.meta{font-size:12px;color:#667085;margin-bottom:6px}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2ff;margin-right:5px;font-size:11px}.overdue{border-left:4px solid #d92d20}.soon{border-left:4px solid #f79009}@media(max-width:750px){.grid{grid-template-columns:1fr}}.empty{color:#667085}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:13px;color:#667085}</style></head><body><h1>🧠 Personal Memory Bank</h1><p class="sub">Capture it once. Turn it into a reminder, plan, or searchable note.</p><div class="grid"><section class="card"><h2>Quick Capture</h2><label>What do you want me to remember?</label><textarea id="text" placeholder="Example: Ask about the monthly inventory report process."></textarea><label>Type</label><select id="type"><option>Work</option><option>Personal</option><option>Idea</option><option>Follow-up</option><option>Learning</option></select><label>When should it come back?</label><input id="due" type="datetime-local"><label>Priority</label><select id="priority"><option>Normal</option><option>High</option><option>Low</option></select><div class="actions"><button onclick="saveEntry()">Save to Memory Bank</button><button class="secondary" onclick="clearForm()">Clear</button></div><p class="small">Dates are stored in this browser for now. We can add calendar/email reminders next.</p></section><section class="card"><h2>What needs attention?</h2><div id="attention"></div></section></div><section class="card" style="margin-top:18px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin-right:auto">My Memories</h2><input id="search" style="max-width:280px;margin:0" placeholder="Search memories..." oninput="render()"><select id="filter" style="max-width:160px;margin:0" onchange="render()"><option>All</option><option>Work</option><option>Personal</option><option>Idea</option><option>Follow-up</option><option>Learning</option></select></div><div id="list"></div></section><script>const KEY='personalMemoryBank.v1';let entries=JSON.parse(localStorage.getItem(KEY)||'[]');function save(){localStorage.setItem(KEY,JSON.stringify(entries))}function saveEntry(){const text=document.getElementById('text').value.trim();if(!text)return alert('Add something to remember first.');entries.unshift({id:Date.now(),text,type:document.getElementById('type').value,due:document.getElementById('due').value,priority:document.getElementById('priority').value,done:false,created:new Date().toISOString()});save();clearForm();render()}function clearForm(){document.getElementById('text').value='';document.getElementById('due').value='';document.getElementById('priority').value='Normal'}function removeEntry(id){entries=entries.filter(x=>x.id!==id);save();render()}function toggleDone(id){const e=entries.find(x=>x.id===id);if(e)e.done=!e.done;save();render()}function fmt(d){if(!d)return 'No reminder set';const x=new Date(d);return x.toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}function render(){const q=document.getElementById('search').value.toLowerCase();const f=document.getElementById('filter').value;const now=Date.now();let filtered=entries.filter(e=>(f==='All'||e.type===f)&&(!q||e.text.toLowerCase().includes(q)||e.type.toLowerCase().includes(q)));filtered.sort((a,b)=>(a.done-b.done)||((a.due?new Date(a.due).getTime():Infinity)-(b.due?new Date(b.due).getTime():Infinity)));document.getElementById('list').innerHTML=filtered.length?filtered.map(e=>`<div class="entry ${e.due&&!e.done&&new Date(e.due)<new Date()?'overdue':e.due&&!e.done&&new Date(e.due)-now<604800000?'soon':''}"><div class="meta"><span class="tag">${e.type}</span><span class="tag">${e.priority}</span> ${fmt(e.due)} ${e.done?' · Done':''}</div><div>${esc(e.text)}</div><div class="actions" style="margin-top:9px"><button class="secondary" onclick="toggleDone(${e.id})">${e.done?'Reopen':'Mark done'}</button><button class="secondary" onclick="removeEntry(${e.id})">Delete</button></div></div>`).join(''):'<p class="empty">Nothing here yet. Capture the first thing you don’t want to forget.</p>';const attention=entries.filter(e=>!e.done&&e.due&&new Date(e.due)<=new Date(Date.now()+7*86400000)).sort((a,b)=>new Date(a.due)-new Date(b.due)).slice(0,5);document.getElementById('attention').innerHTML=attention.length?attention.map(e=>`<div class="entry ${new Date(e.due)<new Date()?'overdue':'soon'}"><b>${esc(e.text)}</b><div class="meta">${e.type} · ${fmt(e.due)}</div></div>`).join(''):'<p class="empty">You’re clear for the next 7 days.</p>'}function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}render();</script></body></html>
