name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workflows_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax checks
        run: |
          node --check workflow-engine.js
          node --check server.js
          node --check agent-tools.js
          node --check agent-team.js
          node --check engineering.js
          node --check portfolio-agent.js
          node --check portfolio.js
          node --check market.js
          node --check caldav.js

      - name: Browser script syntax
        run: node -e "const fs=require('fs'); const html=fs.readFileSync('public/index.html','utf8'); const js=html.match(/<script>([\\s\\S]*?)<\\/script>/); if(!js) throw new Error('Browser script not found'); new Function(js[1]);"

      - name: Test suite
        env:
          TEST_WORKFLOW_DATABASE_URL: postgres://postgres:postgres@localhost:5432/workflows_test
        run: npm test
